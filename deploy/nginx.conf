# nginx server block for the stock-quality web server.
#
# This is intentionally HTTP-only. After copying it in and reloading nginx,
# run `certbot --nginx -d app.ifintok.com` — certbot will obtain a Let's
# Encrypt cert and rewrite this file to add the :443 block + :80→:443
# redirect. No manual SSL editing needed.
#
# Install on the server:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/app.ifintok.com
#   sudo ln -s /etc/nginx/sites-available/app.ifintok.com \
#              /etc/nginx/sites-enabled/app.ifintok.com
#   sudo nginx -t
#   sudo systemctl reload nginx
#   sudo certbot --nginx -d app.ifintok.com
#   sudo certbot renew --dry-run   # confirm auto-renewal works

server {
    listen 80;
    listen [::]:80;
    server_name app.ifintok.com;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The web UI polls /api/requests and /api/best every 3s — keep
        # upstream connections warm to avoid handshake overhead.
        proxy_set_header Connection        "";

        # Reasonable timeouts for an LLM-backed API.
        proxy_connect_timeout 30s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }
}
