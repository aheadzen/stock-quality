  <script>
    // Legacy hash-routing migration. Pre-migration URLs (e.g.
    // /# /stock/AAPL) are silently broken by the move to History API since
    // the hash is invisible to the server. Redirect once, before the SPA
    // boots, so old bookmarks land on the new clean URL.
    (function () {
      var h = location.hash;
      if (h && h.charAt(0) === '#' && h.charAt(1) === '/') {
        history.replaceState(null, '', h.slice(1) + location.search);
      }
    })();
  </script>

  </div>
